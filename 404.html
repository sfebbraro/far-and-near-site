<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Far &amp; Near</title>
<link rel="icon" href="logo/far-and-near-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBFAF8;--ink:#1A1817;--muted:#8A857D;--line:#E6E2DB}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Fraunces',Georgia,serif;color:var(--ink);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
  .mark{height:26px;width:auto;opacity:.45;margin:0 auto 40px}
  .code{font-family:'Jost';font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
  h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:500;line-height:1.2;max-width:18ch;margin:0 auto}
  p{font-family:'Fraunces';font-style:italic;font-size:1.2rem;color:#57534d;margin:18px auto 34px;max-width:34ch}
  a{font-family:'Jost';font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:5px;text-decoration:none}
  a:hover{opacity:.55}
</style>
</head>
<body>
  <div>
    <img class="mark" src="logo/far-and-near-logo-muted.svg" alt="Far &amp; Near">
    <div class="code">Page not found</div>
    <h1>This one wandered off the map.</h1>
    <p>The page you are looking for is not here, but the journey is still on.</p>
    <a href="/">Back to Far &amp; Near</a>
  </div>
</body>
</html>
